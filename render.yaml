services:
  # Express Backend Web Service
  - type: web
    name: digital-heroes-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true

  # Next.js Frontend Web Service
  - type: web
    name: digital-heroes-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: BACKEND_API_URL
        fromService:
          type: web
          name: digital-heroes-backend
          property: host
